          function bind(id,down,up){
            var el=$(id);
            el.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();initAudio();down();},{passive:false});
            el.addEventListener('touchend',function(e){e.preventDefault();e.stopPropagation();if(up)up();},{passive:false});
            el.addEventListener('touchcancel',function(e){e.stopPropagation();if(up)up();},{passive:false});
          }
          bind('bEnter',function(){wantEnter=true;},null);
          bind('bJump',function(){btnJump=true;jumpReq=true;},function(){btnJump=false;});
          bind('bRun',function(){btnRun=true;},function(){btnRun=false;});
          window.addEventListener('keydown',function(e){
