            toast('تم القبض عليك! خسرت جزء من فلوسك');
          }
          function updateWanted(dt){
            var n=Math.min(3,wanted),act=0,k,c;
            for(k=0;k<cops.length;k++){c=cops[k];if(c.mode==='cop'&&c.active)act++;}
            if(wanted>0){
              wantedT+=dt;
              if(act<n){
                for(k=0;k<cops.length;k++){c=cops[k];if(c.mode==='cop'&&!c.active){spawnCop(c);break;}}
              }
              if(wantedT>35){wanted--;wantedT=0;if(wanted===0)toast('انتهى البحث عنك');}
            }else{
              for(k=0;k<cops.length;k++){c=cops[k];if(c.mode==='cop'&&c.active){c.active=false;c.mesh.visible=false;}}
            }
            var near=false,rx=pcar?pcar.x:P.x,rz=pcar?pcar.z:P.z,sp=pcar?Math.abs(pcar.speed):psp;
            for(k=0;k<cops.length;k++){
              c=cops[k];
              if(c.mode==='cop'&&c.active){
                var dx=c.x-rx,dzz=c.z-rz;
                if(dx*dx+dzz*dzz<25)near=true;
              }
            }
            if(near&&sp<7&&wanted>0){bustT+=dt;if(bustT>2.5)bust();}
            else{bustT=Math.max(0,bustT-dt);}
          }

          /* ---------- car logic ---------- */
          function drivePlayer(c,dt){
            var th=-iy,hb=btnJump||keys.Space;
            if(th>0.05){
              if(c.speed<-0.5)c.speed+=45*dt;
              else if(c.speed<40)c.speed+=th*(c.speed<20?24:14)*dt;
            }else if(th<-0.05){
              if(c.speed>0.5)c.speed-=45*dt;
              else if(c.speed>-12)c.speed+=th*14*dt;
            }else{
              var sg=c.speed>0?1:-1;c.speed-=sg*Math.min(Math.abs(c.speed),5*dt);
            }
            if(hb){var sg2=c.speed>0?1:-1;c.speed-=sg2*Math.min(Math.abs(c.speed),38*dt);}
            var ts=ix*0.6/(1+Math.abs(c.speed)*0.1);
            c.steer+=(ts-c.steer)*Math.min(1,8*dt);
            c.a-=c.speed/2.9*Math.tan(c.steer)*dt;
          }
          function aiTraffic(c,dt){
            var dx=c.wx-c.x,dzz=c.wz-c.z;
            if(dx*dx+dzz*dzz<36){aiNext(c);dx=c.wx-c.x;dzz=c.wz-c.z;}
            var want=Math.atan2(dx,dzz),diff=angDiff(want,c.a);
            c.a+=clamp(diff,-2.2*dt,2.2*dt);
            var ts=c.cruise;
            if(Math.abs(diff)>0.5)ts=5;
            var fx=Math.sin(c.a),fz=Math.cos(c.a);
            if(c.ign>0){c.ign-=dt;}
            else{
              var stop=false;
              for(var k=0;k<=cars.length;k++){
                var ox,oz;
                if(k===cars.length){if(pcar)continue;ox=P.x;oz=P.z;}
                else{var o=cars[k];if(o===c||!o.mesh.visible)continue;ox=o.x;oz=o.z;}
                var rx=ox-c.x,rz=oz-c.z,f=rx*fx+rz*fz;
                if(f>0&&f<16){
                  var lat=Math.abs(rx*fz-rz*fx);
                  if(lat<3){ts=Math.min(ts,f<7?0:3);if(f<7)stop=true;}
                }
              }
              if(stop){c.stopT+=dt;if(c.stopT>4){c.ign=2.5;c.stopT=0;}}else{c.stopT=0;}
            }
            c.speed+=(ts-c.speed)*Math.min(1,(ts<c.speed?4:1.2)*dt);
          }
          function aiCop(c,dt){
            var rx=pcar?pcar.x:P.x,rz=pcar?pcar.z:P.z;
            var dx=rx-c.x,dzz=rz-c.z,dist=Math.sqrt(dx*dx+dzz*dzz);
            if(c.rev>0){
              c.rev-=dt;c.speed=-8;c.a+=1.3*dt;return;
            }
            var want=Math.atan2(dx,dzz),diff=angDiff(want,c.a);
            c.a+=clamp(diff,-1.9*dt,1.9*dt);
            var ts=dist>9?(24+wanted*2):4;
            if(Math.abs(diff)>1.0)ts=Math.min(ts,8);
            c.speed+=(ts-c.speed)*Math.min(1,1.6*dt);
          }
          function updateCar(c,dt,tt){
            if(!c.mesh.visible)return;
            if(c.mode==='player')drivePlayer(c,dt);
            else if(c.mode==='traffic')aiTraffic(c,dt);
            else if(c.mode==='cop'){aiCop(c,dt);c.lL.visible=(Math.floor(tt*4)%2===0);c.lR.visible=!c.lL.visible;}
            else{c.speed*=Math.max(0,1-2.5*dt);c.steer*=0.9;}
            c.x+=Math.sin(c.a)*c.speed*dt;c.z+=Math.cos(c.a)*c.speed*dt;
            var hit=collide(c,2.0);
            if(hit){
              if(c===pcar&&Math.abs(c.speed)>14)shake=0.5;
              c.speed*=0.6;
              if(c.mode==='cop'){c.hitT+=dt;if(c.hitT>0.7){c.rev=1.2;c.hitT=0;}}
            }else if(c.hitT>0){c.hitT=Math.max(0,c.hitT-dt);}
            var gy=groundH(c.x,c.z);
            c.y+=(gy-c.y)*Math.min(1,12*dt);
            c.mesh.position.set(c.x,c.y,c.z);
            c.mesh.rotation.y=c.a;
            var k;
            for(k=0;k<4;k++){c.wheels[k].rotation.x+=c.speed*dt/0.38;}
            for(k=0;k<c.pivots.length;k++){c.pivots[k].rotation.y=-c.steer;}
          }
          function carCollisions(){
            for(var a=0;a<cars.length;a++){
              var A=cars[a];if(!A.mesh.visible)continue;
              for(var b=a+1;b<cars.length;b++){
                var B=cars[b];if(!B.mesh.visible)continue;
                var dx=B.x-A.x,dzz=B.z-A.z,d2=dx*dx+dzz*dzz;
                if(d2<12.96&&d2>0.0001){
                  var d=Math.sqrt(d2),p=(3.6-d)/2;dx/=d;dzz/=d;
                  A.x-=dx*p;A.z-=dzz*p;B.x+=dx*p;B.z+=dzz*p;
                  if(Math.abs(A.speed-B.speed)>8&&(A===pcar||B===pcar))shake=0.4;
                  A.speed*=0.85;B.speed*=0.85;
                }
              }
            }
          }
          function toggleCar(){
            if(pcar){
              var c=pcar;pcar=null;c.mode='idle';
              P.x=c.x+Math.cos(c.a)*2.6;P.z=c.z-Math.sin(c.a)*2.6;P.y=groundH(P.x,P.z);P.yaw=c.a;P.vy=0;
              collide(P,0.4);
              hero.g.visible=true;
            }else{
              var best=null,bd=4.5*4.5;
              for(var k=0;k<cars.length;k++){
                var o=cars[k];if(!o.mesh.visible)continue;
                var dx=o.x-P.x,dzz=o.z-P.z,d2=dx*dx+dzz*dzz;
                if(d2<bd){bd=d2;best=o;}
              }
              if(best){
                if(best.mode==='traffic'){crime(1);toast('سرقة سيارة!');}
                else if(best.mode==='cop'){crime(2);toast('سرقت سيارة شرطة!');}
                best.mode='player';best.steer=0;best.active=true;pcar=best;hero.g.visible=false;
              }
            }
          }

          /* ---------- on foot ---------- */
          function updatePlayer(dt){
            var f=-iy,r=ix,len=Math.sqrt(f*f+r*r);
            var sp=(btnRun||keys.ShiftLeft)?8:4.2;
            var sy=Math.sin(camYaw),cy=Math.cos(camYaw);
            var mx=sy*f-cy*r,mz=cy*f+sy*r;
            var amp=0;psp=0;
            if(len>0.1){
              var l=Math.min(1,len),dxn=mx/len,dzn=mz/len;
              P.x+=dxn*sp*l*dt;P.z+=dzn*sp*l*dt;
              P.yaw+=angDiff(Math.atan2(dxn,dzn),P.yaw)*Math.min(1,12*dt);
              hero.phase+=sp*l*dt*2.4;amp=0.9*l;psp=sp*l;
            }
            if(jumpReq&&P.grounded){P.vy=6.5;P.grounded=false;}
            jumpReq=false;
            P.vy-=18*dt;P.y+=P.vy*dt;
            var g=groundH(P.x,P.z);
            if(P.y<=g){P.y=g;P.vy=0;P.grounded=true;}
            collide(P,0.4);
            for(var k=0;k<cars.length;k++){
              var c=cars[k];if(!c.mesh.visible)continue;
              var dx=P.x-c.x,dzz=P.z-c.z,d2=dx*dx+dzz*dzz;
              if(d2<5.3&&d2>0.0001){var d=Math.sqrt(d2);P.x=c.x+dx/d*2.3;P.z=c.z+dzz/d*2.3;}
            }
            hero.g.position.set(P.x,P.y,P.z);hero.g.rotation.y=P.yaw;
            animHuman(hero,P.grounded?amp:0.5);
          }

          /* ---------- camera / HUD ---------- */
          function updateCamera(dt){
            var tx,tz,ty,dist;
            if(pcar){
              tx=pcar.x;tz=pcar.z;ty=pcar.y+1.4;dist=9;
              if(performance.now()-look.last>1800&&look.id===null){
                var tg=pcar.a+(pcar.speed<-1?Math.PI:0);
                camYaw+=angDiff(tg,camYaw)*Math.min(1,2.5*dt);
              }
            }else{tx=P.x;tz=P.z;ty=P.y+1.5;dist=5;}
            camDist+=(dist-camDist)*Math.min(1,4*dt);
            var cp=Math.cos(camPitch),sp=Math.sin(camPitch),s=1,px,py,pz;
            for(var k=0;k<8;k++){
              px=tx-Math.sin(camYaw)*cp*camDist*s;py=ty+sp*camDist*s;pz=tz-Math.cos(camYaw)*cp*camDist*s;
              if(py<0.7)py=0.7;
              if(!blocked(px,py,pz))break;
              s-=0.12;
            }
            if(shake>0){shake=Math.max(0,shake-dt*1.5);px+=(Math.random()-0.5)*shake;py+=(Math.random()-0.5)*shake;}
            camera.position.set(px,py,pz);
            camera.lookAt(tx,ty,tz);
            sky.position.copy(camera.position);
            sun.position.set(tx+40,90,tz+30);sun.target.position.set(tx,0,tz);
          }
          var mapC=$('map'),mx2=mapC.getContext('2d'),mapT=0;
          function drawMap(tt){
            var rx=pcar?pcar.x:P.x,rz=pcar?pcar.z:P.z,s=0.65,k,x,y;
            mx2.fillStyle='#2e3a2e';mx2.fillRect(0,0,130,130);
            mx2.strokeStyle='#59636f';mx2.lineWidth=20*s;
            for(k=0;k<8;k++){
              x=65+(roadsC[k]-rx)*s;
              mx2.beginPath();mx2.moveTo(x,0);mx2.lineTo(x,130);mx2.stroke();
              y=65+(roadsC[k]-rz)*s;
              mx2.beginPath();mx2.moveTo(0,y);mx2.lineTo(130,y);mx2.stroke();
            }
            mx2.fillStyle='#35e04a';
            for(k=0;k<cash.length;k++){
              x=65+(cash[k].position.x-rx)*s;y=65+(cash[k].position.z-rz)*s;
              if(x>0&&x<130&&y>0&&y<130)mx2.fillRect(x-2,y-2,4,4);
            }
            for(k=0;k<cops.length;k++){
              var c=cops[k];
              if(c.mode==='cop'&&c.active){
                x=65+(c.x-rx)*s;y=65+(c.z-rz)*s;
                mx2.fillStyle=(Math.floor(tt*4)%2===0)?'#ff3030':'#3050ff';
                mx2.beginPath();mx2.arc(clamp(x,5,125),clamp(y,5,125),5,0,6.283);mx2.fill();
              }
            }
            mx2.save();mx2.translate(65,65);mx2.rotate(Math.PI-(pcar?pcar.a:P.yaw));
            mx2.fillStyle='#ffffff';mx2.beginPath();mx2.moveTo(0,-8);mx2.lineTo(6,7);mx2.lineTo(-6,7);mx2.closePath();mx2.fill();
            mx2.restore();
          }
          var moneyEl=$('money'),starsEl=$('stars'),speedEl=$('speed'),bEnter=$('bEnter'),bJump=$('bJump'),bRunEl=$('bRun');
          function updateHud(tt){
            moneyEl.textContent='$ '+money;
            var s='';for(var k=0;k<wanted;k++)s+='★';starsEl.textContent=s;
            if(pcar){
              speedEl.textContent=Math.round(Math.abs(pcar.speed)*3.6)+' km/h';
              bEnter.textContent='نزول';bJump.textContent='فرامل';bRunEl.style.display='none';
            }else{
              speedEl.textContent='';bEnter.textContent='ركوب';bJump.textContent='قفز';bRunEl.style.display='flex';
            }
            mapT++;if(mapT%3===0)drawMap(tt);
          }

          /* ---------- main loop ---------- */
          var tAll=0,lastT=performance.now();
          toast('اقترب من السيارة الحمراء واضغط ركوب');
          function update(dt){
            tAll+=dt;
            readInput();
            if(wantEnter){wantEnter=false;toggleCar();}
            if(!pcar){updatePlayer(dt);}
            else{P.x=pcar.x;P.z=pcar.z;jumpReq=false;}
            for(var k=0;k<cars.length;k++)updateCar(cars[k],dt,tAll);
            carCollisions();
            if(pcar){P.x=pcar.x;P.z=pcar.z;}
            updatePeds(dt);updateCash(dt);updateWanted(dt);updateCamera(dt);
            if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.style.opacity=0;}
            if(AC&&gain){
              if(pcar){gain.gain.value=0.05+Math.min(0.06,Math.abs(pcar.speed)*0.002);osc.frequency.value=35+Math.abs(pcar.speed)*3.2;}
              else{gain.gain.value=0;}
            }
            updateHud(tAll);
          }
          function frame(now){
            requestAnimationFrame(frame);
            var dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
            if(dt<=0)return;
            update(dt);
            renderer.render(scene,camera);
          }
          requestAnimationFrame(frame);
          })();
          </script>
          </body>
          </html>
          EOF

      - name: Download three.js
        run: |
          curl -fsSL -o game/app/src/main/assets/three.min.js https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js || curl -fsSL -o game/app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r149/three.min.js
          ls -la game/app/src/main/assets

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build APK
        working-directory: game
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Game-APK
          path: game/app/build/outputs/apk/debug/app-debug.apk
