name: Build GTA Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p game/app/src/main/java/com/city/game
          mkdir -p game/app/src/main/assets

          cat > game/settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "CityGame"
          include ':app'
          EOF

          cat > game/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat > game/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          EOF

          cat > game/app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.city.game'
            compileSdk 34
            defaultConfig {
              applicationId 'com.city.game'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > game/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="City Game"
              android:hardwareAccelerated="true"
              android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="sensorLandscape"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > game/app/src/main/java/com/city/game/MainActivity.java <<'EOF'
          package com.city.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              web.setOverScrollMode(View.OVER_SCROLL_NEVER);
              setContentView(web);
              hideBars();
              web.loadUrl("file:///android_asset/index.html");
            }

            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
            }

            @Override
            public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) hideBars();
            }

            @Override
            protected void onPause() {
              super.onPause();
              web.onPause();
            }

            @Override
            protected void onResume() {
              super.onResume();
              web.onResume();
            }

            @Override
            public void onBackPressed() {
              finish();
            }
          }
          EOF

      - name: Create game page
        run: |
          cat > game/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <style>
          html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif}
          canvas{display:block}
          #map{position:fixed;left:10px;top:10px;width:130px;height:130px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:#222;pointer-events:none}
          #money{position:fixed;right:14px;top:8px;color:#7CFC7C;font-size:26px;font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none}
          #stars{position:fixed;right:14px;top:42px;color:#ffd700;font-size:24px;text-shadow:0 2px 4px #000;pointer-events:none}
          #speed{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#fff;font-size:22px;font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none}
          #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);color:#fff;font-size:20px;background:rgba(0,0,0,.55);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
          #joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.4);display:none;pointer-events:none}
          #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
          .btn{position:fixed;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.7);color:#fff;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center}
          #bEnter{right:26px;bottom:150px}
          #bJump{right:120px;bottom:50px}
          #bRun{right:26px;bottom:42px}
          </style>
          </head>
          <body>
          <canvas id="map" width="130" height="130"></canvas>
          <div id="money">$ 0</div>
          <div id="stars"></div>
          <div id="speed"></div>
          <div id="toast"></div>
          <div id="joy"><div id="knob"></div></div>
          <div class="btn" id="bEnter">ركوب</div>
          <div class="btn" id="bJump">قفز</div>
          <div class="btn" id="bRun">ركض</div>
          <script src="three.min.js"></script>
          <script>
          (function(){
          'use strict';
          var seed=20240611;
          function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
          function rr(a,b){return a+rnd()*(b-a);}
          function clamp(v,a,b){return v<a?a:(v>b?b:v);}
          function angDiff(a,b){var d=a-b;while(d>Math.PI)d-=6.2831853;while(d<-Math.PI)d+=6.2831853;return d;}
          function $(id){return document.getElementById(id);}

          var W=window.innerWidth,Hh=window.innerHeight;
          var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
          renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
          renderer.setSize(W,Hh);
          renderer.shadowMap.enabled=true;
          renderer.shadowMap.type=THREE.PCFSoftShadowMap;
          document.body.appendChild(renderer.domElement);
          var scene=new THREE.Scene();
          scene.fog=new THREE.Fog(0xcfe0ef,90,400);
          var camera=new THREE.PerspectiveCamera(62,W/Hh,0.3,600);
          window.addEventListener('resize',function(){W=window.innerWidth;Hh=window.innerHeight;renderer.setSize(W,Hh);camera.aspect=W/Hh;camera.updateProjectionMatrix();});

          /* ---------- lights & sky ---------- */
          var hemi=new THREE.HemisphereLight(0xdcecff,0x607050,0.85);
          scene.add(hemi);
          var sun=new THREE.DirectionalLight(0xfff1d6,0.95);
          sun.castShadow=true;
          sun.shadow.mapSize.set(1024,1024);
          sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
          sun.shadow.camera.near=1;sun.shadow.camera.far=220;
          sun.shadow.bias=-0.0006;
          scene.add(sun);scene.add(sun.target);

          function mkCanvas(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
          function mkTex(c,rx,ry){var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t;}

          var skyC=mkCanvas(8,256),skx=skyC.getContext('2d'),gr=skx.createLinearGradient(0,0,0,256);
          gr.addColorStop(0,'#3d7cc9');gr.addColorStop(0.5,'#8fc0ee');gr.addColorStop(1,'#d8e8f5');
          skx.fillStyle=gr;skx.fillRect(0,0,8,256);
          var sky=new THREE.Mesh(new THREE.SphereGeometry(450,16,12),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(skyC),side:THREE.BackSide,fog:false,depthWrite:false}));
          sky.renderOrder=-1;
          scene.add(sky);

          /* ---------- textures ---------- */
          function noiseTex(base,lo,hi,n,rx,ry){
            var c=mkCanvas(128,128),x=c.getContext('2d');
            x.fillStyle=base;x.fillRect(0,0,128,128);
            for(var i=0;i<n;i++){var v=lo+((rnd()*(hi-lo))|0);x.fillStyle='rgb('+v+','+v+','+(v+3)+')';x.fillRect(rnd()*128,rnd()*128,2,2);}
            return mkTex(c,rx,ry);
          }
          function grassTex(rx,ry){
            var c=mkCanvas(128,128),x=c.getContext('2d');
            x.fillStyle='#437d3c';x.fillRect(0,0,128,128);
            for(var i=0;i<1200;i++){var g=100+((rnd()*60)|0);x.fillStyle='rgb('+(g-50)+','+g+','+(g-60)+')';x.fillRect(rnd()*128,rnd()*128,2,3);}
            return mkTex(c,rx,ry);
          }
          function sideTex(rx,ry){
            var c=mkCanvas(128,128),x=c.getContext('2d');
            x.fillStyle='#a3a39e';x.fillRect(0,0,128,128);
            x.fillStyle='#85857f';
            for(var i=0;i<128;i+=32){x.fillRect(i,0,2,128);x.fillRect(0,i,128,2);}
            for(var k=0;k<500;k++){var v=140+((rnd()*30)|0);x.fillStyle='rgb('+v+','+v+','+(v-3)+')';x.fillRect(rnd()*128,rnd()*128,2,2);}
            return mkTex(c,rx,ry);
          }
          function winTex(wall,lit){
            var c=mkCanvas(128,128),x=c.getContext('2d');
            x.fillStyle=wall;x.fillRect(0,0,128,128);
            for(var r=0;r<4;r++){for(var q=0;q<4;q++){
              var on=rnd()<lit;
              x.fillStyle=on?'#ffe9a8':(rnd()<0.5?'#1c2a3a':'#2a3e55');
              x.fillRect(q*32+6,r*32+7,20,18);
              x.fillStyle='rgba(255,255,255,0.18)';x.fillRect(q*32+6,r*32+7,20,4);
              x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(q*32+4,r*32+25,24,2);
            }}
            return mkTex(c,1,1);
          }

          /* ---------- helpers ---------- */
          function mergeGeos(arr){
            var pos=[],nor=[],uv=[],idx=[],off=0;
            for(var i=0;i<arr.length;i++){
              var g=arr[i];
              var p=g.attributes.position.array,n=g.attributes.normal.array,u=g.attributes.uv.array,ix=g.index.array;
              var k;
              for(k=0;k<p.length;k++){pos.push(p[k]);nor.push(n[k]);}
              for(k=0;k<u.length;k++){uv.push(u[k]);}
              for(k=0;k<ix.length;k++){idx.push(ix[k]+off);}
              off+=p.length/3;
            }
            var m=new THREE.BufferGeometry();
            m.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
            m.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
            m.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
            m.setIndex(idx);
            return m;
          }
          function plainBox(w,h,d,x,y,z){var g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);return g;}
          function wallBox(w,h,d,x,y,z){
            var g=new THREE.BoxGeometry(w,h,d);
            var uv=g.attributes.uv;
            for(var i=0;i<uv.count;i++){
              var f=(i/4)|0,u=uv.getX(i),v=uv.getY(i);
              if(f===0||f===1){u*=d/12;v*=h/12;}
              else if(f===4||f===5){u*=w/12;v*=h/12;}
              else{u=0.03;v=0.03;}
              uv.setXY(i,u,v);
            }
            g.translate(x,y,z);
            return g;
          }

          /* ---------- world ---------- */
          var colliders=[];
          var ground=new THREE.Mesh(new THREE.PlaneGeometry(640,640),new THREE.MeshLambertMaterial({map:noiseTex('#38383c',40,80,900,80,80)}));
          ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
          var outer=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshLambertMaterial({map:grassTex(500,500)}));
          outer.rotation.x=-Math.PI/2;outer.position.y=-0.1;scene.add(outer);

          var wallCols=['#8d8a82','#a2603f','#6f7f8f','#c8c1b0','#55606b'];
          var wallMats=[],bGeos=[],i,j;
          for(i=0;i<wallCols.length;i++){wallMats.push(new THREE.MeshLambertMaterial({map:winTex(wallCols[i],0.35)}));bGeos.push([]);}
          var roofGeos=[],slabGeos=[],parkGeos=[],treePos=[],lampPos=[];

          for(i=0;i<7;i++){
            for(j=0;j<7;j++){
              var cx=(i-3)*80,cz=(j-3)*80;
              var dist=Math.sqrt(cx*cx+cz*cz);
              var isPark=(rnd()<0.14&&!(i===3&&j===3));
              var sg=new THREE.BoxGeometry(60,0.3,60);sg.translate(cx,0.15,cz);
              if(isPark){
                parkGeos.push(sg);
                for(var t=0;t<12;t++){treePos.push([cx+rr(-24,24),cz+rr(-24,24),rr(0.9,1.5)]);}
              }else{
                slabGeos.push(sg);
                for(var sx=-1;sx<=1;sx+=2){
                  for(var sz=-1;sz<=1;sz+=2){
                    if(rnd()<0.07)continue;
                    var lx=cx+sx*14.5,lz=cz+sz*14.5;
                    var w=rr(17,25),d=rr(17,25);
                    var h=10+rnd()*24+Math.max(0,1-dist/260)*70*rnd();
                    h=Math.round(h/3)*3;
                    var ci=(rnd()*wallCols.length)|0;
                    bGeos[ci].push(wallBox(w,h,d,lx,0.3+h/2,lz));
                    roofGeos.push(plainBox(w-1.2,0.8,d-1.2,lx,0.3+h+0.4,lz));
                    roofGeos.push(plainBox(3,1.6,2,lx+rr(-w/3,w/3),0.3+h+1.6,lz+rr(-d/3,d/3)));
                    colliders.push({x0:lx-w/2,x1:lx+w/2,z0:lz-d/2,z1:lz+d/2,h:h+0.3});
                  }
                }
                var tp=[-22.5,-7.5,7.5,22.5];
                for(var q=0;q<4;q++){
                  treePos.push([cx+tp[q],cz-29.3,rr(0.8,1.2)]);
                  treePos.push([cx+tp[q],cz+29.3,rr(0.8,1.2)]);
                  treePos.push([cx-29.3,cz+tp[q],rr(0.8,1.2)]);
                  treePos.push([cx+29.3,cz+tp[q],rr(0.8,1.2)]);
                }
              }
              lampPos.push([cx-29.6,cz-29.6],[cx+29.6,cz-29.6],[cx-29.6,cz+29.6],[cx+29.6,cz+29.6]);
            }
          }
          for(i=0;i<bGeos.length;i++){
            if(bGeos[i].length){scene.add(new THREE.Mesh(mergeGeos(bGeos[i]),wallMats[i]));}
          }
          scene.add(new THREE.Mesh(mergeGeos(roofGeos),new THREE.MeshLambertMaterial({color:0x4a4a4e})));
          var slabMesh=new THREE.Mesh(mergeGeos(slabGeos),new THREE.MeshLambertMaterial({map:sideTex(10,10)}));
          slabMesh.receiveShadow=true;scene.add(slabMesh);
          if(parkGeos.length){
            var parkMesh=new THREE.Mesh(mergeGeos(parkGeos),new THREE.MeshLambertMaterial({map:grassTex(8,8)}));
            parkMesh.receiveShadow=true;scene.add(parkMesh);
          }

          var dummy=new THREE.Object3D();
          var trunkMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22,0.34,3,6),new THREE.MeshLambertMaterial({color:0x5b3a1e}),treePos.length);
          var leafMesh=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.1,1),new THREE.MeshLambertMaterial({color:0x2f7a35,flatShading:true}),treePos.length);
          for(i=0;i<treePos.length;i++){
            var tpv=treePos[i];
            dummy.rotation.set(0,rnd()*6.28,0);
            dummy.scale.set(tpv[2],tpv[2],tpv[2]);
            dummy.position.set(tpv[0],0.3+1.5*tpv[2],tpv[1]);dummy.updateMatrix();trunkMesh.setMatrixAt(i,dummy.matrix);
            dummy.position.set(tpv[0],0.3+4.0*tpv[2],tpv[1]);dummy.updateMatrix();leafMesh.setMatrixAt(i,dummy.matrix);
          }
          trunkMesh.frustumCulled=false;leafMesh.frustumCulled=false;
          scene.add(trunkMesh);scene.add(leafMesh);

          var poleMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.1,0.12,7,6),new THREE.MeshLambertMaterial({color:0x33363a}),lampPos.length);
          var headMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.9,0.2,0.4),new THREE.MeshBasicMaterial({color:0xfff2c0}),lampPos.length);
          dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);
          for(i=0;i<lampPos.length;i++){
            dummy.position.set(lampPos[i][0],3.8,lampPos[i][1]);dummy.updateMatrix();poleMesh.setMatrixAt(i,dummy.matrix);
            dummy.position.set(lampPos[i][0],7.2,lampPos[i][1]);dummy.updateMatrix();headMesh.setMatrixAt(i,dummy.matrix);
          }
          poleMesh.frustumCulled=false;headMesh.frustumCulled=false;
          scene.add(poleMesh);scene.add(headMesh);

          /* road dashes */
          var dashList=[],roadsC=[];
          for(i=0;i<8;i++){roadsC.push(-280+80*i);}
          function nearInter(v){for(var k=0;k<8;k++){if(Math.abs(v-roadsC[k])<13)return true;}return false;}
          for(i=0;i<8;i++){
            for(var p=-292;p<=292;p+=8){
              if(nearInter(p))continue;
              dashList.push([roadsC[i],p,0]);
              dashList.push([p,roadsC[i],1]);
            }
          }
          var dashMat=new THREE.MeshBasicMaterial({color:0xe8e0a0,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
          var dashMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.3,0.04,3),dashMat,dashList.length);
          for(i=0;i<dashList.length;i++){
            dummy.position.set(dashList[i][0],0.02,dashList[i][1]);
            dummy.rotation.set(0,dashList[i][2]?Math.PI/2:0,0);
            dummy.updateMatrix();dashMesh.setMatrixAt(i,dummy.matrix);
          }
          dashMesh.frustumCulled=false;scene.add(dashMesh);

          function groundH(x,z){
            var bx=Math.round(x/80)*80,bz=Math.round(z/80)*80;
            if(Math.abs(bx)<=240&&Math.abs(bz)<=240&&Math.abs(x-bx)<30&&Math.abs(z-bz)<30)return 0.3;
            return 0;
          }
          function collide(o,r){
            var hit=false;
            for(var k=0;k<colliders.length;k++){
              var c=colliders[k];
              if(o.x<c.x0-r||o.x>c.x1+r||o.z<c.z0-r||o.z>c.z1+r)continue;
              var nx=Math.max(c.x0,Math.min(o.x,c.x1)),nz=Math.max(c.z0,Math.min(o.z,c.z1));
              var dx=o.x-nx,dz=o.z-nz,d2=dx*dx+dz*dz;
              if(d2<r*r){
                if(d2>0.000001){var d=Math.sqrt(d2);o.x=nx+dx/d*r;o.z=nz+dz/d*r;}
                else{
                  var l=o.x-c.x0,rg=c.x1-o.x,tp=o.z-c.z0,bt=c.z1-o.z,m=Math.min(l,rg,tp,bt);
                  if(m===l)o.x=c.x0-r;else if(m===rg)o.x=c.x1+r;else if(m===tp)o.z=c.z0-r;else o.z=c.z1+r;
                }
                hit=true;
              }
            }
            o.x=clamp(o.x,-295,295);o.z=clamp(o.z,-295,295);
            return hit;
          }
          function blocked(x,y,z){
            for(var k=0;k<colliders.length;k++){
              var c=colliders[k];
              if(x>c.x0-0.4&&x<c.x1+0.4&&z>c.z0-0.4&&z<c.z1+0.4&&y<c.h+0.4)return true;
            }
            return false;
          }

          /* ---------- humans ---------- */
          var capG=new THREE.CapsuleGeometry(0.24,0.42,4,10);
          var headG=new THREE.SphereGeometry(0.17,14,12);
          var hairG=new THREE.SphereGeometry(0.18,14,8,0,Math.PI*2,0,Math.PI*0.55);
          var armG=new THREE.CapsuleGeometry(0.075,0.5,3,8);armG.translate(0,-0.325,0);
          var legG=new THREE.CapsuleGeometry(0.1,0.7,3,8);legG.translate(0,-0.45,0);
          var matCache={};
          function lamb(c){var k='m'+c;if(!matCache[k])matCache[k]=new THREE.MeshLambertMaterial({color:c});return matCache[k];}
          var skins=[0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac];
          var hairs=[0x1a1a1a,0x4a2f1b,0x8b6b3d,0x222222,0xaaaaaa];
          var shirts=[0xc0392b,0x2980b9,0x27ae60,0xf1c40f,0x8e44ad,0xecf0f1,0x2c3e50,0xe67e22];
          var pantsC=[0x2c3e50,0x1b1b1b,0x4b5563,0x3b5998,0x6b4f2a];
          function pick(a){return a[(rnd()*a.length)|0];}
          function makeHuman(shirt,pants,skin,hair){
            var g=new THREE.Group();
