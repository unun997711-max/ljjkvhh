          }

          /* ---------- UI / input ---------- */
          var toastEl=$('toast'),toastT=0;
          function toast(s){toastEl.textContent=s;toastEl.style.opacity=1;toastT=2.5;}
          var camYaw=0,camPitch=0.32,camDist=5,shake=0;
          var joy={x:0,y:0,id:null,sx:0,sy:0},look={id:null,lx:0,ly:0,last:0};
          var keys={},btnRun=false,btnJump=false,jumpReq=false,wantEnter=false;
          var ix=0,iy=0;
          var joyEl=$('joy'),knob=$('knob');
          var AC=null,osc=null,gain=null;
          function initAudio(){
            if(AC)return;
            try{
              AC=new (window.AudioContext||window.webkitAudioContext)();
              osc=AC.createOscillator();osc.type='sawtooth';
              gain=AC.createGain();gain.gain.value=0;
              var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
              osc.connect(lp);lp.connect(gain);gain.connect(AC.destination);osc.start();
            }catch(e){AC=null;}
          }
          document.addEventListener('touchstart',function(e){
            e.preventDefault();initAudio();
            for(var k=0;k<e.changedTouches.length;k++){
              var t=e.changedTouches[k];
              if(t.clientX<window.innerWidth*0.45){
                if(joy.id===null){
                  joy.id=t.identifier;joy.sx=t.clientX;joy.sy=t.clientY;
                  joyEl.style.display='block';joyEl.style.left=(t.clientX-60)+'px';joyEl.style.top=(t.clientY-60)+'px';
                  knob.style.left='35px';knob.style.top='35px';
                }
              }else if(look.id===null){
                look.id=t.identifier;look.lx=t.clientX;look.ly=t.clientY;
              }
            }
          },{passive:false});
          document.addEventListener('touchmove',function(e){
            e.preventDefault();
            for(var k=0;k<e.changedTouches.length;k++){
              var t=e.changedTouches[k];
              if(t.identifier===joy.id){
                var dx=t.clientX-joy.sx,dy=t.clientY-joy.sy,l=Math.sqrt(dx*dx+dy*dy),m=55;
                if(l>m){dx=dx/l*m;dy=dy/l*m;}
                joy.x=dx/m;joy.y=dy/m;
                knob.style.left=(35+dx)+'px';knob.style.top=(35+dy)+'px';
              }else if(t.identifier===look.id){
                camYaw-=(t.clientX-look.lx)*0.006;
