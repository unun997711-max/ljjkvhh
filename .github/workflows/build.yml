              tries++;
              tc.ni=(rnd()*8)|0;tc.nj=(rnd()*8)|0;tc.dir=(rnd()*4)|0;
              tc.x=-280+80*tc.ni+LX[tc.dir];tc.z=-280+80*tc.nj+LZ[tc.dir];
              var ddx=tc.x+31,ddz=tc.z+2;
              okp=(ddx*ddx+ddz*ddz>2500);
              for(j=0;j<cars.length-1&&okp;j++){
