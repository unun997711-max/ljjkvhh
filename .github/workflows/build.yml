          /* traffic */
          var palette=[0xc0392b,0x2c3e50,0xecf0f1,0xf1c40f,0x16a085,0x7f8c8d,0x2980b9,0xe67e22,0x111111];
          for(i=0;i<14;i++){
            var tc=makeCar(pick(palette),false);
