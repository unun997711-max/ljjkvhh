            if(ni<0||ni>7||nj<0||nj>7){
              var all=[d,(d+1)%4,(d+3)%4,(d+2)%4];
              for(var k=0;k<4;k++){
                ch=all[k];ni=c.ni+DI[ch];nj=c.nj+DJ[ch];
                if(ni>=0&&ni<=7&&nj>=0&&nj<=7)break;
              }
