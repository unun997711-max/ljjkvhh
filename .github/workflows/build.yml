              if(e.code==='Space')jumpReq=true;
            }
            keys[e.code]=true;
          });
          window.addEventListener('keyup',function(e){keys[e.code]=false;});
          function dz(v){return Math.abs(v)<0.12?0:v;}
          function readInput(){
            ix=clamp(dz(joy.x)+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),-1,1);
            iy=clamp(dz(joy.y)+((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0),-1,1);
          }

          /* ---------- wanted / police ---------- */
          var wanted=0,wantedT=0,bustT=0;
          function crime(n){wanted=Math.min(5,wanted+n);wantedT=0;}
          function spawnCop(c){
            for(var k=0;k<25;k++){
              var ni=(rnd()*8)|0,nj=(rnd()*8)|0;
              var x=-280+80*ni+LX[0],z=-280+80*nj+LZ[0];
              var rx=pcar?pcar.x:P.x,rz=pcar?pcar.z:P.z;
              if((x-rx)*(x-rx)+(z-rz)*(z-rz)>10000||k===24){c.x=x;c.z=z;break;}
            }
            c.a=0;c.speed=0;c.active=true;c.mesh.visible=true;c.hitT=0;c.rev=0;
          }
          function bust(){
            wanted=0;bustT=0;money=Math.floor(money*0.75);
            if(pcar){pcar.mode='idle';pcar=null;}
