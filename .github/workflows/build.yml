          /* ---------- player ---------- */
          var P={x:-31.5,y:0,z:-12,yaw:0,vy:0,grounded:true};
          var hero=makeHuman(0x2f6fdd,0x2b2b33,0xe0ac69,0x1a1a1a);
          var psp=0;

          /* ---------- peds ---------- */
          var peds=[],HALF=27.6;
          function loopPos(s,h){
            var side=Math.floor(s/(2*h)),t=s-side*2*h;
            if(side===0)return [-h+t,-h,1,0];
            if(side===1)return [h,-h+t,0,1];
            if(side===2)return [h-t,h,-1,0];
            return [-h,h-t,0,-1];
          }
          for(i=0;i<26;i++){
            var ph=makeHuman(pick(shirts),pick(pantsC),pick(skins),pick(hairs));
            ph.bx=((rnd()*7)|0)*80-240;ph.bz=((rnd()*7)|0)*80-240;
            ph.s=rnd()*8*HALF;ph.dir=rnd()<0.5?1:-1;ph.speed=rr(1.1,1.9);ph.down=false;ph.downT=0;
            peds.push(ph);
          }
          function updatePeds(dt){
            for(var k=0;k<peds.length;k++){
              var p=peds[k];
              if(p.down){
                p.downT+=dt;
                if(p.downT>8){p.down=false;p.g.rotation.x=0;}
                continue;
              }
              p.s=(p.s+p.dir*p.speed*dt+8*HALF)%(8*HALF);
              var lp=loopPos(p.s,HALF);
              p.g.position.set(p.bx+lp[0],0.3,p.bz+lp[1]);
              p.g.rotation.y=Math.atan2(lp[2]*p.dir,lp[3]*p.dir);
              p.phase+=p.speed*dt*3.2;animHuman(p,0.7);
              for(var q=0;q<cars.length;q++){
                var c=cars[q];
                if(!c.mesh.visible||Math.abs(c.speed)<3)continue;
                var dx=c.x-p.g.position.x,dz=c.z-p.g.position.z;
                if(dx*dx+dz*dz<4.5){
                  p.down=true;p.downT=0;p.g.rotation.x=-1.45;p.g.position.y=0.5;
                  if(c===pcar){crime(1);toast('دهست شخص! مطلوب للشرطة');}
                  break;
                }
              }
            }
          }

          /* ---------- cash ---------- */
          var money=0,cash=[];
          var coinGeo=new THREE.CylinderGeometry(0.55,0.55,0.12,16);coinGeo.rotateX(Math.PI/2);
          var coinMat=new THREE.MeshPhongMaterial({color:0xffc400,shininess:100,emissive:0x553300});
          function placeCash(m){
            var k=(rnd()*8)|0,v=roadsC[k]+rr(-7,7),a=rr(-280,280);
            if(rnd()<0.5){m.position.set(v,1.2,a);}else{m.position.set(a,1.2,v);}
          }
          for(i=0;i<40;i++){var cm=new THREE.Mesh(coinGeo,coinMat);placeCash(cm);scene.add(cm);cash.push(cm);}
          function updateCash(dt){
            var rx=pcar?pcar.x:P.x,rz=pcar?pcar.z:P.z;
            for(var k=0;k<cash.length;k++){
              var m=cash[k];m.rotation.y+=dt*3;
